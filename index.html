<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var glow = JSON.parse(localStorage.getItem('settings:glowColor'));
          document.documentElement.setAttribute('data-glow', glow || 'none');
        } catch (e) {
          document.documentElement.setAttribute('data-glow', 'none');
        }
        try {
          var theme = JSON.parse(localStorage.getItem('settings:themeMode'));
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          } else {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="preload" href="/icon.png" as="image" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Helios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
